global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/export-alerts.yml

scrape_configs:
  - job_name: korus-core-api
    metrics_path: /api/v1/metrics/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: korus-ws-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9198"]

  - job_name: korus-message-pipeline
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9197"]

  - job_name: korus-export-replay-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9193"]

  - job_name: korus-retention-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9192"]

  - job_name: korus-push-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9194"]

  - job_name: korus-preview-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9195"]

  - job_name: korus-deep-archiver
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9196"]

  - job_name: korus-indexer
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9199"]
