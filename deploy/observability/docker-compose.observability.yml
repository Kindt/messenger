# Local Prometheus + Alertmanager + Grafana (host stack on 8080 / 9193).
# Optional Loki overlay: docker-compose.loki.yml
# Usage: docker compose -f deploy/observability/docker-compose.observability.yml up -d

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-export-alerts.example.yml:/etc/prometheus/rules/export-alerts.yml:ro
      - ./prometheus-fleet-alerts.example.yml:/etc/prometheus/rules/fleet-alerts.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    environment:
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-http://127.0.0.1:9/alertmanager-webhook}
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--config.expand-env"
      - "--storage.path=/alertmanager"

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana-export-dashboard.json:/var/lib/grafana/dashboards/export.json:ro
      - ./grafana-fleet-dashboard.json:/var/lib/grafana/dashboards/fleet.json:ro
      - ./grafana-lab-performance-dashboard.json:/var/lib/grafana/dashboards/lab-performance.json:ro
    depends_on:
      - prometheus
