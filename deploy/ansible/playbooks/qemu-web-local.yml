---
# Run on QEMU web guest after server API is up
- name: Korus QEMU web guest deploy
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    korus_repo_root: "{{ korus_repo_root | default('/mnt/korus') }}"
    korus_server_lan_ip: "10.0.2.2"
    korus_api_port: 18080
    korus_ws_port: 18082
    korus_browser_ws_host: "{{ korus_qemu_host_lan_ip | default('127.0.0.1') }}"
    korus_browser_ws_port: 19088
    korus_web_base_url: "http://127.0.0.1:9088"
    korus_build_images: "{{ korus_build_images | default(false) | bool }}"
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/korus_web.yml
  roles:
    - common
    - korus_web
