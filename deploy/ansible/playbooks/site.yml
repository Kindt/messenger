---
# Two-host: server then web; optional smoke tag
- name: Korus server host
  hosts: korus_server
  gather_facts: false
  vars:
    korus_repo_root: "{{ playbook_dir }}/../../.."
    korus_use_lan_publish: true
  tasks:
    - name: Common prerequisites
      ansible.builtin.import_role:
        name: common
      tags: [always, server]

    - name: Deploy server stack
      ansible.builtin.import_role:
        name: korus_server
      tags: [server]

- name: Korus web host
  hosts: korus_web
  gather_facts: false
  vars:
    korus_repo_root: "{{ playbook_dir }}/../../.."
    korus_web_base_url: >-
      {{ 'https://' ~ korus_tls_domain if (korus_tls_enabled | default(false) | bool)
         else 'http://' ~ korus_web_lan_ip ~ ':' ~ (korus_web_port | string) }}
  tasks:
    - name: Common prerequisites
      ansible.builtin.import_role:
        name: common
      tags: [always, web]

    - name: Deploy web stack
      ansible.builtin.import_role:
        name: korus_web
      tags: [web]

    - name: TLS reverse proxy
      ansible.builtin.import_role:
        name: tls
      tags: [web, tls]
      when: korus_tls_enabled | default(false) | bool

- name: Smoke from control node
  hosts: localhost
  gather_facts: false
  vars:
    korus_repo_root: "{{ playbook_dir }}/../../.."
    korus_api_base_url: "http://{{ hostvars[groups['korus_server'][0]]['ansible_host'] }}:{{ korus_api_port }}"
    korus_ws_url: "ws://{{ hostvars[groups['korus_server'][0]]['ansible_host'] }}:{{ korus_ws_port }}/ws"
    korus_web_base_url: >-
      {{ 'https://' ~ hostvars[groups['korus_web'][0]]['korus_tls_domain']
         if (hostvars[groups['korus_web'][0]]['korus_tls_enabled'] | default(false) | bool)
         else 'http://' ~ hostvars[groups['korus_web'][0]]['ansible_host'] ~ ':' ~ (korus_web_port | string) }}
    korus_skip_korus_web_smoke: "0"
    korus_tls_enabled: "{{ hostvars[groups['korus_web'][0]]['korus_tls_enabled'] | default(false) }}"
    korus_tls_domain: "{{ hostvars[groups['korus_web'][0]]['korus_tls_domain'] | default('') }}"
  tasks:
    - name: Post-deploy acceptance
      ansible.builtin.import_role:
        name: korus_smoke
      tags: [smoke]
      when: groups['korus_server'] | length > 0
