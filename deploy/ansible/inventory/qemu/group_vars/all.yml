---
# QEMU slirp netdev today: web guest 10.0.2.15, host gateway 10.0.2.2 (port-forwards 18080/18082/19088).
# When 192.168.76.x user LAN is wired (deploy/qemu/config.ps1), switch server/web LAN IPs and ws_gateway_port to 8082.
korus_server_lan_ip: "10.0.2.2"
korus_web_lan_ip: "10.0.2.15"
korus_api_port: 18080
korus_ws_port: 18082
korus_ws_gateway_port: 18082
korus_web_api_upstream: "http://10.0.2.2:18080"
korus_use_lan_publish: false
korus_configure_ufw: false
korus_browser_ws_port: 19088
korus_docker_buildkit: "0"
korus_compose_bake: "0"
# Wave 1 FR-OPT-01: QEMU server guest uses pilot compose (no Solr/ZK) by default.
korus_deploy_profile: pilot
