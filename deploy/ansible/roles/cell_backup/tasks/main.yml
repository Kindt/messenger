---
# Cell backup role (spec 011 T01114) — Phase 1: cron + local pg_dump stub; S3 upload Phase 2.

- name: Require backup targets or preset
  ansible.builtin.assert:
    that:
      - (cell_backup_targets | length > 0) or (cell_backup_preset | length > 0)
    fail_msg: "Set cell_backup_targets or cell_backup_preset (expand manifest via cell-manifest-expand.py)"

- name: Install backup script
  ansible.builtin.template:
    src: korus-cell-backup.sh.j2
    dest: "{{ cell_backup_script_path }}"
    mode: "0750"
  when: inventory_hostname in groups.get('korus_server', [])

- name: Daily backup cron (s3_daily schedule from preset)
  ansible.builtin.cron:
    name: "korus-cell-backup-{{ cell_backup_cell_id }}"
    minute: "0"
    hour: "2"
    job: "{{ cell_backup_script_path }} >> /var/log/korus-cell-backup.log 2>&1"
    user: "{{ cell_backup_cron_user }}"
  when: inventory_hostname in groups.get('korus_server', [])
