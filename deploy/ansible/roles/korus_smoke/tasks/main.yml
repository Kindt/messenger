---
- name: Wait stack ready script
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ korus_repo_root }}"
    BASE_URL="{{ korus_api_base_url }}" TIMEOUT_SEC=420 bash scripts/wait-stack-ready.sh
  args:
    executable: /bin/bash
  changed_when: false

- name: Ensure smoke test users
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ korus_repo_root }}"
    BASE_URL="{{ korus_api_base_url }}" bash scripts/keycloak-ensure-smoke-users.sh
  args:
    executable: /bin/bash
  changed_when: false

- name: Run deploy acceptance smoke pack
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ korus_repo_root }}"
    BASE_URL="{{ korus_api_base_url }}" \
    WS_URL="{{ korus_ws_url }}" \
    SKIP_KORUS_WEB="{{ korus_skip_korus_web_smoke | default('1') }}" \
    bash scripts/smoke-deploy-acceptance.sh
  args:
    executable: /bin/bash
  changed_when: false

- name: Run TLS redirect smoke (when TLS enabled)
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ korus_repo_root }}"
    pwsh -NoProfile -File scripts/smoke-tls-redirect.ps1 \
      -HttpUrl "http://{{ korus_tls_domain }}" \
      -HttpsUrl "https://{{ korus_tls_domain }}" \
      -ExpectedCertSubject "{{ korus_tls_domain }}"
  args:
    executable: /bin/bash
  changed_when: false
  when:
    - korus_tls_enabled | default(false) | bool
    - korus_tls_domain is defined
    - korus_run_tls_smoke | default(true) | bool
  tags:
    - smoke
    - tls_smoke
