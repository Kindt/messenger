---
- name: LiveKit env file for compose (QEMU host browser URL)
  ansible.builtin.import_tasks: livekit-env.yml

- name: Template server secrets env from vault
  ansible.builtin.template:
    src: korus-server.env.j2
    dest: "{{ korus_server_env_path }}"
    mode: "0600"
  when: >
    korus_db_password is defined
    or korus_minio_secret_key is defined
    or korus_keycloak_admin_password is defined
    or korus_jwt_secret is defined
    or korus_coturn_secret is defined
    or korus_vapid_public_key is defined
    or korus_vapid_private_key is defined
    or korus_vapid_subject is defined
    or korus_cors_allowed_origins is defined
    or korus_keycloak_issuer is defined
    or korus_keycloak_jwks_url is defined

- name: Log QEMU build phase (skips above are expected on localhost)
  ansible.builtin.shell: |
    printf '\n>>> Starting full-stack-up.sh%s (Gradle+Docker build, 15-30 min on first boot)\n' \
      "{{ ' --build' if korus_build_images | bool else '' }}" >> {{ korus_bootstrap_log }}
  args:
    executable: /bin/bash
  changed_when: false

- name: Full stack up via project script
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ korus_repo_root }}"
    # shellcheck source=/dev/null
    . "{{ korus_repo_root }}/deploy/qemu/vm-bootstrap/korus-plain-build-env.sh"
    export SKIP_KORUS_ENSURE=1
    export DOCKER_BUILDKIT={{ korus_docker_buildkit | default('1') }}
    export COMPOSE_BAKE={{ korus_compose_bake | default('1') }}
    export KORUS_FLEET_LAB={{ 1 if (korus_fleet_lab | default(false) | bool) else 0 }}
    {% if korus_fleet_lab | default(false) | bool %}
    if [[ -f docker/fleet-targets.qemu.json ]]; then
      export FLEET_TARGETS_JSON="$(tr -d '\n\r' < docker/fleet-targets.qemu.json)"
    elif [[ -f docker/fleet-targets.lab.json ]]; then
      export FLEET_TARGETS_JSON="$(tr -d '\n\r' < docker/fleet-targets.lab.json)"
    fi
    {% elif korus_fleet_targets_json is defined %}
    export FLEET_TARGETS_JSON='{{ korus_fleet_targets_json }}'
    {% endif %}
    if [[ -f "{{ korus_server_env_path }}" ]]; then
      set -a
      # shellcheck source=/dev/null
      source "{{ korus_server_env_path }}"
      set +a
    fi
    if [[ -f "{{ korus_repo_root }}/docker/.env.livekit" ]]; then
      set -a
      # shellcheck source=/dev/null
      source "{{ korus_repo_root }}/docker/.env.livekit"
      set +a
    fi
    profile="{{ korus_deploy_profile | default('standard') }}"
    args=( --skip-ensure )
    if [[ "$profile" == "pilot" ]]; then
      script="scripts/pilot-stack-up.sh"
      args+=( --down-full-first )
    elif [[ "$profile" == "enterprise" || "{{ korus_enable_scale | default(false) | lower }}" == "true" ]]; then
      script="scripts/enterprise-stack-up.sh"
      args+=( --no-wait-ready )
      export KORUS_ENABLE_READ_REPLICA={{ 1 if (korus_enable_read_replica | default(false) | bool) else 0 }}
    else
      script="scripts/full-stack-up.sh"
      args+=( --no-wait-ready )
    fi
    if {{ korus_build_images | bool | lower }}; then args+=( --build ); fi
    stdbuf -oL -eL bash "$script" "${args[@]}" 2>&1 \
      | stdbuf -oL tee -a {{ korus_bootstrap_log }}
  args:
    executable: /bin/bash
  register: korus_server_up
  changed_when: korus_build_images | bool

- name: Wait for core-api health
  ansible.builtin.uri:
    url: "{{ korus_api_base_url }}/api/v1/health"
    status_code: 200
  register: korus_api_health
  until: korus_api_health.status == 200
  retries: 60
  delay: 5

- name: Wait for Keycloak realm
  ansible.builtin.uri:
    url: "{{ korus_keycloak_url }}/realms/avandocmsg"
    status_code: 200
  register: korus_kc_realm
  until: korus_kc_realm.status == 200
  retries: 40
  delay: 5
  ignore_errors: true

- name: Ensure dev Keycloak users
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ korus_repo_root }}"
    KEYCLOAK_URL="{{ korus_keycloak_url }}" bash scripts/keycloak-ensure-dev-users.sh
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false

- name: Wait stack ready (workers)
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ korus_repo_root }}"
    BASE_URL="{{ korus_api_base_url }}" TIMEOUT_SEC=420 bash scripts/wait-stack-ready.sh
  args:
    executable: /bin/bash
  changed_when: false
  when: (korus_deploy_profile | default('standard')) != 'pilot'

- name: Media enterprise profile notes (spec 022)
  ansible.builtin.debug:
    msg: "media_enterprise tag applied — see docs/sizing/MEDIA_ENTERPRISE.md and docker compose overlays"
  tags:
    - media_enterprise
    - never
