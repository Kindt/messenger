---
- name: Template korus-web .env
  ansible.builtin.template:
    src: korus-web.env.j2
    dest: "{{ korus_web_env_path }}"
    mode: "0644"
  register: korus_web_env_template

- name: Korus web stack up
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ korus_repo_root }}"
    # QEMU console plain build (ignored path); optional on CI/localhost checkout
    _plain_env="{{ korus_repo_root }}/deploy/qemu/vm-bootstrap/korus-plain-build-env.sh"
    if [[ -f "$_plain_env" ]]; then
      # shellcheck source=/dev/null
      . "$_plain_env"
    fi
    export SKIP_KORUS_ENSURE=1
    export DOCKER_BUILDKIT={{ korus_docker_buildkit | default('1') }}
    export COMPOSE_BAKE={{ korus_compose_bake | default('1') }}
    args=()
    if {{ korus_build_images | bool | lower }}; then args+=( --build ); fi
    if {{ korus_web_attach | bool | lower }}; then args+=( --attach ); fi
    if {{ korus_web_turn_prod | default(false) | bool | lower }}; then
      args+=( --turn-prod )
    elif {{ korus_web_turn | default(false) | bool | lower }}; then
      args+=( --turn )
    fi
    if {{ korus_web_env_template.changed | bool | lower }}; then args+=( --force-recreate ); fi
    stdbuf -oL -eL bash scripts/korus-web-up.sh "${args[@]}" 2>&1 \
      | stdbuf -oL tee -a {{ korus_bootstrap_log }}
  args:
    executable: /bin/bash
  register: korus_web_up
  changed_when: true

- name: Wait for korus-web health
  ansible.builtin.uri:
    url: "{{ korus_web_base_url }}/health"
    return_content: true
  register: korus_web_health
  until: korus_web_health.status == 200 and korus_web_health.content is search('ok')
  retries: 30
  delay: 5

- name: Verify web-client-env.js wsUrl and iceServersJson keys
  ansible.builtin.uri:
    url: "{{ korus_web_base_url }}/web-client-env.js"
    return_content: true
  register: korus_web_env_js
  failed_when: >
    korus_web_env_js.status != 200 or
    'wsUrl' not in korus_web_env_js.content or
    'iceServersJson' not in korus_web_env_js.content

- name: Verify browser wsUrl uses expected LAN host (QEMU)
  when: korus_browser_ws_host is defined and (korus_browser_ws_host | string) | length > 0
  ansible.builtin.assert:
    that:
      - korus_browser_ws_host in korus_web_env_js.content
    fail_msg: "web-client-env.js wsUrl missing korus_browser_ws_host={{ korus_browser_ws_host }}"
