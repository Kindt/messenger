---
# korus_repo_root set per-playbook from playbook_dir/../../..
korus_build_images: true
korus_skip_ensure: true
korus_run_smoke: false
korus_api_port: 8080
korus_ws_port: 8082
korus_web_port: 9088
# CI localhost / single-host; site.yml overrides for multi-host.
korus_api_base_url: "http://127.0.0.1:{{ korus_api_port }}"
korus_keycloak_url: "http://127.0.0.1:8081"
# TLS reverse proxy (roles/tls); false keeps HTTP-only dev/QEMU/CI path.
korus_tls_enabled: false
# Writable on CI localhost; QEMU guests use /var/log/korus-bootstrap.log
korus_bootstrap_log: "/var/log/korus-bootstrap.log"
