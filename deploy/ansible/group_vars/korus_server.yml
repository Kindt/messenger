---
# Rendered by roles/korus_server/templates/korus-server.env.j2 (vault + deploy profile).
korus_server_env_path: "{{ korus_repo_root }}/docker/.env.korus-server"
korus_external_stack_manifest_path: "{{ korus_repo_root }}/docker/external-stack-manifest.yaml"

# Product add-ons: comma-separated list of enabled add-on ids; empty = Base-only.
# All available add-ons are listed in docs/product-modules.yaml.
korus_product_addons: ""
# Example: "addon-engage,addon-search,addon-retention,addon-export,addon-archive,addon-deep-archive,addon-live,addon-bots,addon-integrations,addon-e2ee,addon-enterprise-auth"

# core-api container mode (spec 021 Phase 7.2): embedded (default) | war (Tomcat/Jetty WAR image).
# war requires CoreApiComposition bootstrap (T021-100) and docker/Dockerfile.core-api.war build.
korus_core_api_deploy_mode: embedded
# korus_core_api_war_container_image: korus-messenger-core-api-war:local

# Jenkins / ADO pipeline overrides
# korus_repo_root: /var/lib/jenkins/workspace/korus-messenger
