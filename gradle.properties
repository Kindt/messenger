org.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Android mobile client (spec 032)
android.useAndroidX=true
android.enableJetifier=true

# Spec 025 FR-088 / FR-063 / FR-064 / FR-090 — test parallelism (0 = auto: half of available CPUs)
korus.test.maxParallelForks=0
# Transient failure retry for unit tests (0 = disabled)
korus.test.retry.maxRetries=1
