# Режим разработки: одна реплика web-client, статика из dev-overlay (bind-mount).
# Запуск: scripts/dev-overlay-up.ps1 / dev-overlay-up.sh (из korus-web с .env)
#
# Не поднимает web-b и lb — только web-dev на KORUS_WEB_DEV_PORT (по умолчанию 9088).

services:
  web-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web-client
    image: korus-messenger-web-client:local
    ports:
      - "0.0.0.0:${KORUS_WEB_DEV_PORT:-9088}:9080"
    environment:
      WEB_CLIENT_PORT: "9080"
      WEB_CLIENT_API_UPSTREAM: ${WEB_CLIENT_API_UPSTREAM:-http://host.docker.internal:8080}
      WEB_CLIENT_WS_PUBLIC_URL: ${WEB_CLIENT_WS_PUBLIC_URL:-ws://localhost:9088/ws}
      WEB_CLIENT_RTC_ICE_SERVERS: ${WEB_CLIENT_RTC_ICE_SERVERS:-}
      WEB_CLIENT_VAPID_PUBLIC_KEY: ${WEB_CLIENT_VAPID_PUBLIC_KEY:-}
      WEB_CLIENT_WEBUI_OVERLAY: /overlay/webui
    volumes:
      - ../dev-overlay/webui:/overlay/webui:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
