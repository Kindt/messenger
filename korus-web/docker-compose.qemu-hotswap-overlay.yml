# Overlay on docker-compose.yml: add web-dev bind-mount; lb -> web-dev (/ws unchanged).
# Used by qemu-full-stack-up and qemu-web-hotswap -Enable on QEMU web guest.
# Dev UI sync (webui.tgz) is the same path for dev and full stack profiles.

services:
  web-dev:
    image: korus-messenger-web-client:local
    expose:
      - "9080"
    environment:
      WEB_CLIENT_PORT: "9080"
      WEB_CLIENT_API_UPSTREAM: ${WEB_CLIENT_API_UPSTREAM:-http://host.docker.internal:8080}
      WEB_CLIENT_WS_PUBLIC_URL: ${WEB_CLIENT_WS_PUBLIC_URL:-ws://localhost:9088/ws}
      WEB_CLIENT_RTC_ICE_SERVERS: ${WEB_CLIENT_RTC_ICE_SERVERS:-}
      WEB_CLIENT_VAPID_PUBLIC_KEY: ${WEB_CLIENT_VAPID_PUBLIC_KEY:-}
      WEB_CLIENT_WEBUI_OVERLAY: /overlay/webui
    volumes:
      - ../modules/web-client/src/main/resources/webui:/overlay/webui:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  lb:
    environment:
      NGINX_CONF_TEMPLATE: /etc/nginx/nginx.conf.hotswap.template
    depends_on:
      web-a:
        condition: service_started
      web-b:
        condition: service_started
      web-dev:
        condition: service_started
