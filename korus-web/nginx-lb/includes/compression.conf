# FR-173 / T078: gzip + brotli for static text assets (nginx-static overlay).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/wasm
    image/svg+xml
    font/woff
    font/woff2;

brotli on;
brotli_comp_level 5;
brotli_min_length 256;
brotli_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/wasm
    image/svg+xml
    font/woff
    font/woff2;

# Pre-compressed siblings (.gz / .br) from future Vite/ESBuild output.
gzip_static on;
brotli_static on;
