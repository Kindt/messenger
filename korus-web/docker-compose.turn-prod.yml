# Production/stage coturn overlay — credentials from korus-web/.env (Ansible vault).
# ICE servers are templated in WEB_CLIENT_RTC_ICE_SERVERS (.env); this file starts coturn only.
#
# Set KORUS_COTURN_EXTERNAL_IP (public IP/FQDN) when the web host is behind NAT — required for relay.
# Optional KORUS_COTURN_RELAY_IP when relay binds a different interface.
#
#   docker compose -f docker-compose.yml -f docker-compose.turn-prod.yml up -d
# From repo root: ./scripts/korus-web-up.sh --turn-prod

services:
  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
    environment:
      KORUS_COTURN_SECRET: ${KORUS_COTURN_SECRET:?set KORUS_COTURN_SECRET in .env}
      KORUS_COTURN_EXTERNAL_IP: ${KORUS_COTURN_EXTERNAL_IP:-}
      KORUS_COTURN_RELAY_IP: ${KORUS_COTURN_RELAY_IP:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        EXTRA=""
        if [ -n "$$KORUS_COTURN_EXTERNAL_IP" ]; then
          EXTRA="$$EXTRA --external-ip=$$KORUS_COTURN_EXTERNAL_IP"
        fi
        if [ -n "$$KORUS_COTURN_RELAY_IP" ]; then
          EXTRA="$$EXTRA --relay-ip=$$KORUS_COTURN_RELAY_IP"
        elif [ -n "$$KORUS_COTURN_EXTERNAL_IP" ]; then
          EXTRA="$$EXTRA --relay-ip=$$KORUS_COTURN_EXTERNAL_IP"
        fi
        exec turnserver -n --log-file=stdout \
          --listening-ip=0.0.0.0 --listening-port=3478 \
          --min-port=10000 --max-port=10100 \
          --fingerprint --lt-cred-mech \
          --user=korus:$$KORUS_COTURN_SECRET \
          --realm=korus-messenger-turn --no-cli \
          --allowed-peer-ip=0.0.0.0-255.255.255.255 \
          $$EXTRA
