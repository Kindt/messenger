# Korus Web stack (spec 021 Phase 7.4).
#
# Recommended default (prod / QEMU): nginx-only static webui + /api proxy:
#   docker compose -f docker-compose.yml -f docker-compose.nginx-only.yml up --build -d
#
# Legacy Java replicas (web-a / web-b): profile legacy-java-replicas
#   docker compose --profile legacy-java-replicas up --build -d
#   Image: docker/Dockerfile.web-client.legacy (docker/Dockerfile.web-client deprecated).
#
# UI behind lb: http://localhost:${KORUS_WEB_LB_PORT:-9088}

services:
  web-a:
    profiles: ["legacy-java-replicas"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.web-client.legacy
    image: korus-messenger-web-client:local
    environment:
      WEB_CLIENT_PORT: "9080"
      WEB_CLIENT_API_UPSTREAM: ${WEB_CLIENT_API_UPSTREAM:-http://host.docker.internal:8080}
      WEB_CLIENT_WS_PUBLIC_URL: ${WEB_CLIENT_WS_PUBLIC_URL:-ws://localhost:9088/ws}
      WEB_CLIENT_RTC_ICE_SERVERS: ${WEB_CLIENT_RTC_ICE_SERVERS:-}
      WEB_CLIENT_VAPID_PUBLIC_KEY: ${WEB_CLIENT_VAPID_PUBLIC_KEY:-}
    expose:
      - "9080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web-b:
    profiles: ["legacy-java-replicas"]
    image: korus-messenger-web-client:local
    depends_on:
      web-a:
        condition: service_started
    environment:
      WEB_CLIENT_PORT: "9080"
      WEB_CLIENT_API_UPSTREAM: ${WEB_CLIENT_API_UPSTREAM:-http://host.docker.internal:8080}
      WEB_CLIENT_WS_PUBLIC_URL: ${WEB_CLIENT_WS_PUBLIC_URL:-ws://localhost:9088/ws}
      WEB_CLIENT_RTC_ICE_SERVERS: ${WEB_CLIENT_RTC_ICE_SERVERS:-}
      WEB_CLIENT_VAPID_PUBLIC_KEY: ${WEB_CLIENT_VAPID_PUBLIC_KEY:-}
    expose:
      - "9080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  lb:
    build:
      context: ./nginx-lb
      dockerfile: Dockerfile
    ports:
      - "${KORUS_WEB_LB_PORT:-9088}:80"
    environment:
      KORUS_WS_GATEWAY_HOST: ${KORUS_WS_GATEWAY_HOST:-host.docker.internal}
      KORUS_WS_GATEWAY_PORT: ${KORUS_WS_GATEWAY_PORT:-8081}
    depends_on:
      - web-a
      - web-b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
