# Compose overrides for export compliance smokes (admin suggest/export APIs).
# Usage:
#   docker compose -f docker/docker-compose.full-server.yml -f docker/docker-compose.export-smoke.yml up -d core-api
services:
  core-api:
    environment:
      # Export admin/job APIs are gated by addon-export; CI/lab uses default secrets.
      KORUS_LAB_ALLOW_DEV_SECRETS: "1"
      KORUS_PRODUCT_ADDONS: "${KORUS_PRODUCT_ADDONS:-addon-export,addon-retention}"
      EXPORT_ADMIN_SUGGEST_ENABLED: "true"
      EXPORT_ADMIN_EXPORT_ENABLED: "true"
      EXPORT_SUGGESTED_SUBSCRIBER_ENABLED: "true"
  export-replay-worker:
    environment:
      EXPORT_REPLAY_INCLUDE_FILE_BODIES: "true"
