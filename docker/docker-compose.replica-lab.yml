# Tier-2 read host lab overlay (distinct hostname; not streaming replication).
# See docker/REPLICA_LAB.md. Use with full-server base compose.
#
#   docker compose -f docker/docker-compose.full-server.yml \
#     -f docker/docker-compose.replica-lab.yml up -d

version: "3.8"

services:
  postgres-replica-lab:
    image: postgres:16
    environment:
      POSTGRES_USER: avandocmsg
      POSTGRES_PASSWORD: avandocmsg
      POSTGRES_DB: avandocmsg_hot
    volumes:
      - postgres_replica_lab_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avandocmsg -d avandocmsg_hot"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-api:
    environment:
      DB_READ_JDBC_URL: jdbc:postgresql://postgres-replica-lab:5432/avandocmsg_hot
      DB_READ_POOL_SIZE: "10"
    depends_on:
      postgres-replica-lab:
        condition: service_healthy

volumes:
  postgres_replica_lab_data:
