# Scale overlay (spec 006 FR-OPT-04): 2× message-pipeline + 2× ws-gateway.
# Usage (from repo root, Linux guest / CI):
#   docker compose -f docker/docker-compose.full-server.yml -f docker/docker-compose.scale.yml up -d
#
# NATS queue group `pipeline-workers` is shared by message-pipeline and message-pipeline-2.
# ws-gateway-2 has no host port; point nginx ip_hash upstream to ws-gateway:8081 and ws-gateway-2:8081.

version: "3.8"

services:
  message-pipeline-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.message-pipeline
    environment:
      NATS_URL: nats://nats:4222
      DB_JDBC_URL: jdbc:postgresql://postgres-hot:5432/avandocmsg_hot
      DB_USER: avandocmsg
      DB_PASSWORD: avandocmsg
      NATS_JETSTREAM: "false"
      APP_LOCALE: ru
    depends_on:
      postgres-hot:
        condition: service_healthy
      nats:
        condition: service_started

  ws-gateway-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ws-gateway
    expose:
      - "8081"
    environment:
      WS_PORT: 8081
      NATS_URL: nats://nats:4222
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/avandocmsg
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/avandocmsg/protocol/openid-connect/certs
      APP_LOCALE: ru
    depends_on:
      nats:
        condition: service_started
      keycloak:
        condition: service_started

  core-api:
    environment:
      API_REPLICAS: "2"
