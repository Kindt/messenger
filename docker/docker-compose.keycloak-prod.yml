# Keycloak production mode override (FR-OPT-02).
# Merge with full-server + pilot-overrides for prod Keycloak.
#
#   docker compose -f docker/docker-compose.full-server.yml -f docker/docker-compose.pilot-overrides.yml -f docker/docker-compose.keycloak-prod.yml up -d

version: "3.8"

services:
  keycloak:
    build:
      context: ..
      dockerfile: docker/Dockerfile.keycloak-prod
    image: korus-keycloak-prod:24
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-hot
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: avandocmsg_hot
      KC_DB_USERNAME: avandocmsg
      KC_DB_PASSWORD: avandocmsg
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      JAVA_OPTS_KC: "-Xms128m -Xmx256m -XX:MaxMetaspaceSize=96m -XX:+UseContainerSupport"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s
