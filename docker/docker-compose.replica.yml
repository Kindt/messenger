# Read-replica routing overlay (spec 006 FR-OPT-05).
# Lab/dev: read pool targets the same postgres-hot (validates routing code without streaming replication).
# Production: set DB_READ_JDBC_URL to streaming replica host before merge.
#
#   docker compose -f docker/docker-compose.full-server.yml -f docker/docker-compose.replica.yml up -d

version: "3.8"

services:
  core-api:
    environment:
      DB_READ_JDBC_URL: jdbc:postgresql://postgres-hot:5432/avandocmsg_hot
      DB_READ_POOL_SIZE: "10"
      API_REPLICAS: "1"
