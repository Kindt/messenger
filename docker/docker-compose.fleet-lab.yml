# Lab overlay: admin fleet snapshot HTTP probes.
# Targets: export FLEET_TARGETS_JSON before compose, or defaults in full-stack-up.sh (ws + pipeline).
# QEMU: Ansible sets full JSON (incl. web nginx LB). See inventory/qemu/group_vars/all.yml.

version: "3.8"

services:
  core-api:
    environment:
      FLEET_AGGREGATOR_NODE: core-api@qemu-server
      FLEET_PROBE_TIMEOUT_MS: "2000"
      FLEET_TARGETS_JSON: ${FLEET_TARGETS_JSON}
