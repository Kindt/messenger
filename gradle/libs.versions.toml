testfx-junit5 = { module = "org.testfx:testfx-junit5", version.ref = "testfx" }
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }

[bundles]
prometheus-server = ["prometheus-simpleclient", "prometheus-simpleclient-hotspot", "prometheus-simpleclient-httpserver", "prometheus-simpleclient-common"]
logging = ["logback-classic", "slf4j-api"]

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
