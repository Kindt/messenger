sonar.projectKey=ru.korusconsulting:korus-messenger
sonar.projectName=korus-messenger
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/build/**,**/node_modules/**,**/*.bundle.js,**/webui-build/**

# Gradle modules — binary paths: build/classes/java/{main,test}
sonar.modules=common,core-domain,core-port,core-api,web-client,ws-gateway

common.sonar.projectBaseDir=modules/common
common.sonar.sources=src/main/java
common.sonar.tests=src/test/java
common.sonar.java.binaries=build/classes/java/main
common.sonar.java.test.binaries=build/classes/java/test

core-domain.sonar.projectBaseDir=modules/core-domain
core-domain.sonar.sources=src/main/java
core-domain.sonar.tests=src/test/java
core-domain.sonar.java.binaries=build/classes/java/main
core-domain.sonar.java.test.binaries=build/classes/java/test

core-port.sonar.projectBaseDir=modules/core-port
core-port.sonar.sources=src/main/java
core-port.sonar.tests=src/test/java
core-port.sonar.java.binaries=build/classes/java/main
core-port.sonar.java.test.binaries=build/classes/java/test

core-api.sonar.projectBaseDir=modules/core-api
core-api.sonar.sources=src/main/java
core-api.sonar.tests=src/test/java
core-api.sonar.java.binaries=build/classes/java/main
core-api.sonar.java.test.binaries=build/classes/java/test

web-client.sonar.projectBaseDir=modules/web-client
web-client.sonar.sources=src/main/java
web-client.sonar.tests=src/test/java
web-client.sonar.java.binaries=build/classes/java/main
web-client.sonar.java.test.binaries=build/classes/java/test

ws-gateway.sonar.projectBaseDir=modules/ws-gateway
ws-gateway.sonar.sources=src/main/java
ws-gateway.sonar.tests=src/test/java
ws-gateway.sonar.java.binaries=build/classes/java/main
ws-gateway.sonar.java.test.binaries=build/classes/java/test
