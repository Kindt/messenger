name: pages-deck-smoke

# Lightweight check on committed docs/index.html (no rebuild).
# Full presentation pytest: run locally before commit.

on:
  pull_request:
    paths:
      - 'docs/index.html'
      - 'docs/.nojekyll'
  workflow_dispatch:

jobs:
  deck-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Require prebuilt deck
        run: test -f docs/index.html
      - run: python scripts/presentation/smoke_deck.py
      - run: python scripts/presentation/analyze_deck.py --verbose
