# E2E: Ansible deploy + messaging acceptance + Playwright.
# Manual: Actions -> Deploy messaging smoke -> Run workflow
# Nightly: 05:00 UTC
name: Deploy messaging smoke

on:
  workflow_dispatch:
    inputs:
      skip_down:
        description: Leave stack running after smoke
        type: boolean
        default: false
      skip_playwright:
        description: Skip Playwright E2E job
        type: boolean
        default: false
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

concurrency:
  group: deploy-messaging-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ansible and smoke dependencies
        run: |
          pip install ansible websocket-client
          ansible --version

      - name: Build images (Gradle assemble)
        run: chmod +x gradlew scripts/*.sh scripts/lib/*.sh && ./gradlew :modules:core-api:assemble :modules:workers:export-replay:assemble :modules:workers:retention:assemble --no-daemon -q

      - name: Ansible deploy + acceptance smoke
        run: |
          cd deploy/ansible
          ansible-playbook -i inventory/local/hosts.yml playbooks/ci-local.yml -e run_smoke=true

      - name: Diagnostics on failure
        if: failure()
        run: bash scripts/ci-stack-diagnostics.sh full-server

      - name: Stack down
        if: always() && (github.event_name == 'schedule' || github.event.inputs.skip_down != 'true')
        run: |
          chmod +x scripts/*.sh
          ./scripts/full-stack-down.sh

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    if: ${{ github.event_name == 'schedule' || github.event.inputs.skip_playwright != 'true' }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/web-client/webui-build/package-lock.json

      - name: Install webui Tailwind deps
        run: npm ci
        working-directory: modules/web-client/webui-build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install smoke dependencies
        run: pip install websocket-client

      - name: Build images (Gradle assemble)
        run: chmod +x gradlew scripts/*.sh scripts/lib/*.sh && ./gradlew :modules:core-api:assemble :modules:web-client:assemble --no-daemon -q

      - name: Full stack + korus-web up
        run: |
          ./scripts/full-stack-up.sh --skip-ensure --build --no-wait-ready
          TIMEOUT_SEC=600 ./scripts/wait-stack-ready.sh
          bash scripts/keycloak-ensure-dev-users.sh
          bash scripts/keycloak-verify-realm.sh
          ./scripts/korus-web-up.sh --attach --skip-ensure --build

      - name: Install Playwright
        working-directory: tests/e2e-web
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Playwright E2E
        working-directory: tests/e2e-web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:9088
          KORUS_WEB_URL: http://127.0.0.1:9088
          KORUS_API_URL: http://127.0.0.1:8080
        run: npx playwright test

      - name: Diagnostics on failure
        if: failure()
        run: bash scripts/ci-stack-diagnostics.sh full-server

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e-web/playwright-report/
          retention-days: 7

      - name: Stack down
        if: always()
        run: |
          chmod +x scripts/*.sh
          ./scripts/korus-web-down.sh --attach || true
          ./scripts/full-stack-down.sh || true
