name: Deploy product deck to GitHub Pages

# Publishes committed docs/ as-is (deck built locally via scripts/presentation/publish-deck.ps1).
# No CI rebuild — source of truth is docs/index.html in git.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require prebuilt deck
        run: |
          test -f docs/index.html || (echo "Missing docs/index.html — run: .\\scripts\\presentation\\publish-deck.ps1" && exit 1)
          test -f docs/.nojekyll || touch docs/.nojekyll

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Smoke committed deck (no rebuild)
        run: |
          pip install pyyaml
          python scripts/presentation/smoke_deck.py
          python scripts/presentation/analyze_deck.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
