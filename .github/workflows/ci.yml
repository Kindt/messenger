name: CI

# Disabled on push/PR — gate runs locally (./gradlew buildIntegrity).
# Re-enable push trigger when CI is stable again.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Set up Node.js (web-client Tailwind)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/web-client/webui-build/package-lock.json

      - name: Install webui Tailwind deps
        run: npm ci
        working-directory: modules/web-client/webui-build

      - name: Build webui assets
        run: npm run build:assets
        working-directory: modules/web-client/webui-build

      - name: First-load perf gate (SC-024, lab static)
        run: npm run test:first-load
        working-directory: modules/web-client/webui-build

      - name: Set up Python (cell manifest gate)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python test deps
        run: pip install pyyaml

      - name: "buildIntegrity (compile, test, spotless ratchet, npm audit, benchmark)"
        run: chmod +x gradlew && ./gradlew buildIntegrity --no-daemon -Pkorus.test.retry.maxRetries=2
