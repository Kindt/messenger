name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Set up Node.js (web-client Tailwind)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/web-client/webui-build/package-lock.json

      - name: Install webui Tailwind deps
        run: npm ci
        working-directory: modules/web-client/webui-build

      - name: "buildIntegrity (all modules: compile, test, assemble)"
        run: chmod +x gradlew && ./gradlew buildIntegrity --no-daemon

      - name: "benchmark (core-api timing guards, non-blocking)"
        run: ./gradlew :modules:core-api:benchmark --no-daemon
        continue-on-error: true
