# Container portability nightly (spec 021 Phase 7.5).
# Generator parity + Gradle WAR artifacts blocking; docker runtime on GitHub ubuntu is build-only.
# Full WAR runtime: scripts/smoke-container-portability-guest.ps1 on QEMU (T021-143 green 2026-06-20).name: container-portability-nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  generator-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pytest web-client-env generator parity
        run: python -m pytest scripts/test_generate_web_client_env.py -q

  war-matrix:
    runs-on: ubuntu-latest
    needs: generator-parity
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build core-api and ws-gateway WAR artifacts
        run: ./gradlew :modules:core-api:war :modules:ws-gateway:war --no-daemon -x test

      - name: Note runtime WAR smoke
        run: |
          echo "Runtime: scripts/smoke-container-portability-guest.ps1 on QEMU server guest."
          echo "T021-081: WAR runtime matrix blocking when guest smoke is green in CI (future)."
