server {
    listen 8080;
    root /usr/share/nginx/html;
    default_type application/json;

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location ~ ^/jira/rest/api/2/issue/([A-Z0-9-]+)\.json$ {
        try_files /jira/rest/api/2/issue/$1.json =404;
    }

    location = /confluence/rest/api/content/search {
        try_files /confluence/rest/api/content/search.json =404;
    }

    location ~ ^/naumen/api/tickets/([A-Za-z0-9-]+)\.json$ {
        try_files /naumen/api/tickets/$1.json =404;
    }

    location = /bitrix/rest/crm.deal.get.json {
        try_files /bitrix/crm.deal.get.json =404;
    }

    location = /exchange/v1.0/me/calendarview.json {
        try_files /exchange/v1.0/me/calendarview.json =404;
    }

    location = /storage/v1/search.json {
        try_files /storage/v1/search.json =404;
    }

    location = /ocr/v1/extract.json {
        try_files /ocr/v1/extract.json =404;
    }

    location = /ai/v1/triage.json {
        try_files /ai/v1/triage.json =404;
    }

    location = /1c/odata/Catalog_Items.json {
        try_files /1c/odata/Catalog_Items.json =404;
    }

    location ~ ^/1c/odata/Documents_([A-Za-z0-9_]+)_([0-9]+)\.json$ {
        try_files /1c/odata/Documents_$1_$2.json =404;
    }
}
