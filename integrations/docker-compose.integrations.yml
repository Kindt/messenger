  integrations-gateway:
    image: nginx:1.27-alpine
    depends_on:
      connector-runtime:
        condition: service_healthy
    ports:
      - "8090:8090"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
