# Spec 014 — integrations VM compose (korus-integrations @ 192.168.76.30)
# Usage on integrations guest: docker compose -f integrations/docker-compose.integrations.yml up -d

services:
  mock-apis:
    image: nginx:1.27-alpine
    volumes:
      - ./_mock-servers/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./_mock-servers/fixtures:/usr/share/nginx/html:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  connector-runtime:
    build:
      context: ..
      dockerfile: docker/Dockerfile.connector-runtime-worker
    image: korus/connector-runtime-worker:local
    environment:
      CONNECTOR_RUNTIME_PORT: "8091"
      CONNECTOR_RUNTIME_METRICS_PORT: "9191"
      MOCK_API_BASE: "http://mock-apis:8080"
    depends_on:
      mock-apis:
        condition: service_healthy
    ports:
      - "8091:8091"
      - "9198:9191"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9191/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  echo-php:
    build:
      context: ./demos/echo/echo-php82
    image: korus/echo-plugin-php82:local
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  echo-go:
    build:
      context: ./demos/echo/echo-go
    image: korus/echo-plugin-go:local
    ports:
      - "8089:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  bitrix24-crm-bot:
    build:
      context: ./demos/bitrix24-crm-bot
    image: korus/bitrix24-crm-bot:local
    environment:
      BITRIX_MOCK_BASE: "http://mock-apis:8080"
    depends_on:
      mock-apis:
        condition: service_healthy
    ports:
      - "8092:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  echo-powershell:
    build:
      context: ./demos/echo/echo-powershell51
    image: korus/echo-powershell:local
    ports:
      - "8087:8087"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8087/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  echo-java8:
    build:
      context: ./demos/echo/echo-java8
    image: korus/echo-java8:local
    ports:
      - "8086:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  echo-vbnet:
    build:
      context: ./demos/echo/echo-vbnet48
    image: korus/echo-vbnet48-demo:local
    ports:
      - "8085:8086"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8086/health >/dev/null || exit 1"]
      interval: 15s
