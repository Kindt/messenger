events {
    worker_connections 128;
}

http {
    upstream connector {
        server connector-runtime:8091;
    }
    upstream echo_php {
        server echo-php:8080;
    }
    upstream echo_go {
        server echo-go:8080;
    }
    upstream bitrix_bot {
        server bitrix24-crm-bot:8080;
    }
    upstream echo_ps {
        server echo-powershell:8087;
    }
    upstream echo_java8 {
        server echo-java8:8080;
    }
    upstream echo_vbnet {
        server echo-vbnet:8086;
    }
    upstream exchange_bridge {
        server exchange-bridge:8093;
    }
    upstream storage_bridge {
        server storage-bridge:8094;
    }
    upstream ocr_worker {
        server ocr-worker:8095;
    }
    upstream ai_bridge {
        server ai-bridge:8096;
    }

    server {
        listen 8090;

        location /connector/ {
            proxy_pass http://connector/;
        }
        location /echo-php/ {
            proxy_pass http://echo_php/;
        }
        location /echo-go/ {
            proxy_pass http://echo_go/;
        }
        location /bitrix/ {
            proxy_pass http://bitrix_bot/;
        }
        location /echo-ps/ {
            proxy_pass http://echo_ps/;
        }
        location /echo-java8/ {
            proxy_pass http://echo_java8/;
        }
        location /echo-vbnet/ {
            proxy_pass http://echo_vbnet/;
        }
        location /exchange/ {
            proxy_pass http://exchange_bridge/;
        }
        location /storage/ {
            proxy_pass http://storage_bridge/;
        }
        location /ocr/ {
            proxy_pass http://ocr_worker/;
        }
        location /ai/ {
            proxy_pass http://ai_bridge/;
        }
        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
