<!DOCTYPE html>

<html
      lang="ru"
      data-palette="korus"
      data-appearance="dark"
      data-device="desktop"
      data-orientation="landscape"
      data-mobile-shell="0"
    >

  <head>

    <meta charset="UTF-8" />

    <meta

      name="viewport"

      content="width=device-width, initial-scale=1.0, viewport-fit=cover"

    />

    <meta name="theme-color" content="#7949f4" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Korus" />

    <title>Korus Messenger</title>

    <script>
      (function () {
        try {
          var raw = localStorage.getItem("korus_web_style");
          if (!raw) return;
          var parsed = JSON.parse(raw);
          if (!parsed) return;
          var html = document.documentElement;
          if (parsed.appearance === "light" || parsed.appearance === "dark") {
            html.setAttribute("data-appearance", parsed.appearance);
          }
          if (parsed.palette) {
            html.setAttribute("data-palette", parsed.palette);
          }
        } catch (e) {}
      })();
    </script>

    <script src="/ui-device-profile.js"></script>

    <link rel="manifest" href="/manifest.json" />

    <link rel="icon" href="/icon.svg" type="image/svg+xml" />

    <link rel="apple-touch-icon" href="/icon.svg" />

    <link rel="stylesheet" href="/fonts.css" />

    <link rel="stylesheet" href="/tailwind.css" />

    <link rel="stylesheet" href="/styles.css" />

    <link rel="stylesheet" href="/themes.css" />

  </head>

  <body>

    <div id="root"></div>

    <script src="/web-client-env.js"></script>

    <!-- T073/FR-082: production bundle (~32 modules). Rebuild: npm run build:js in webui-build -->

    <!-- FR-087: MLS WASM + OpenMLS dev build stay outside bundle; load before bundle (defer order) -->
    <!-- FR-121: ui-call-mesh.js / ui-call-livekit.js lazy via import("/ui-lazy-call.mjs") in app.bundle.js -->

    <script src="/korus-mls-wasm.js" defer></script>

    <script src="/e2ee/openmls/korus-openmls-dev.js" defer></script>

    <script src="/app.bundle.js" defer></script>

  </body>

</html>
