app.version=0.1.0-SNAPSHOT
server.port=8080

# Локаль текстов API (сообщения ApiError, подписи параметров UUID). ru — по умолчанию; en — английский.
# Переменная окружения APP_LOCALE переопределяет (например en, en-US).
app.locale=ru

# CORS: * = любой Origin; иначе список через запятую (точное совпадение, без логирования секретов в ответах).
# cors.allowed.origins=*

# Timing normalization for sensitive GET paths (0 = off). Env: SECURITY_TIMING_NORMALIZATION_MIN_MS
# Pilot/QEMU: 220ms — both exist/miss paths pad to target; prod tune via audit-timing.ps1
# security.timing.normalization.min.ms=220

db.jdbc.url=jdbc:postgresql://localhost:5432/avandocmsg_hot
db.user=avandocmsg
db.password=avandocmsg
db.pool.size=10
# Read replica (spec 006 FR-OPT-05): empty = reads use primary
# db.read.jdbc.url=
# db.read.pool.size=10
# api.replicas=1
# postgres.max.connections=100

redis.uri=redis://localhost:6379
# Read cache (spec 006 FR-OPT-03): opt-in; requires Redis. Env REDIS_READ_CACHE_ENABLED=true
# redis.read.cache.enabled=false
# redis.read.cache.ttl.chat_list.seconds=60
# redis.read.cache.ttl.chat_unread.seconds=30
# redis.read.cache.ttl.user_profile.seconds=120
# redis.read.cache.ttl.user_presence.seconds=15
nats.url=nats://localhost:4222
nats.jetstream=false

rate.limit.auth.enabled=false
rate.limit.auth.login.per.minute=60
rate.limit.auth.register.per.hour=5

keycloak.issuer=http://localhost:8081/realms/avandocmsg
keycloak.jwks.url=http://localhost:8081/realms/avandocmsg/protocol/openid-connect/certs
# Опционально: ожидаемый aud в JWT (переменная KEYCLOAK_AUDIENCE), иначе claim не проверяется.
# keycloak.audience=messenger-web
# realm master + admin-cli (переменные KEYCLOAK_MASTER_USER / KEYCLOAK_MASTER_PASSWORD)
keycloak.master.user=admin
keycloak.master.password=admin

# Медиа / WebRTC (клиент)
media.max.upload.bytes=52428800
file.dedup.enabled=true
jitsi.meet.base.url=https://meet.jit.si
conference.room.prefix=avandocmsg-

# Live-streaming L2 POC (spec 013): LiveKit SFU — set all three to enable token issue
# livekit.url=ws://127.0.0.1:7880
# livekit.api.key=devkey
# livekit.api.secret=secret  # min 32 bytes for HS256; dev default in compose
livestream.room.prefix=korus-live-
livestream.max.webrtc.viewers=200
webrtc.stun.uris=stun:stun.l.google.com:19302

# Опционально: полнотекстовый поиск сообщений (Solr, ТЗ п. 14). Без этого работает SQL fallback.
# solr.zk.hosts=
# solr.http.url=http://localhost:8983/solr
# solr.collection=messages_meta

# TTL публичных ссылок на файлы по умолчанию (сек), ТЗ п. 15
# file.public.link.default.ttl.seconds=604800

# Ретенция (дефолты платформы для GET /admin/organizations/{orgId}/retention при отсутствии строки в БД; см. docs/RETENTION_AND_DEEP_ARCHIVE.md)
# retention.default.hot_body_max_age_days=
# retention.default.hot_metadata_min_age_days=
# retention.default.archive_metadata_enabled=true
# retention.default.deep_archive_enabled=true
# retention.default.legal_hold=false

# Отдельный воркер пакетной ретенции (modules/workers/retention); по умолчанию выключен (см. docs/RETENTION_AND_DEEP_ARCHIVE.md).
# retention.worker.enabled=false
# retention.scan.interval.seconds=3600
# Процесс RetentionWorker читает env (не ключи этого файла): RETENTION_BATCH_LIMIT, RETENTION_INITIAL_DELAY_SECONDS,
# RETENTION_REQUIRE_MINIO, RETENTION_USE_APPLIED_LOG, RETENTION_AUDIT_ENABLED, RETENTION_ENSURE_MINIO_BUCKET,
# RETENTION_MINIO_BUCKET, RETENTION_MINIO_OBJECT_PREFIX, RETENTION_METRICS_PORT, RETENTION_JDBC_QUERY_TIMEOUT_SECONDS,
# RETENTION_INTER_MESSAGE_DELAY_MS (0…60000, по умолчанию 0 — без паузы между кандидатами в одном проходе hot-body),
# RETENTION_SNAPSHOT_TEMPFILE_THRESHOLD_BYTES (по умолчанию 0 — выкл.; если >0 и UTF-8 длина messages.content строго больше порога — JSON снимка на диске перед MinIO putObject; макс. 1 GiB),
# RETENTION_MINIO_MULTIPART_THRESHOLD_BYTES (по умолчанию не задан = Long.MAX_VALUE — для temp-file только putObject; при заданном положительном пороге и size файла >= порога — uploadObject, напр. 33554432),
# RETENTION_DRY_RUN (по умолчанию false — только SELECT кандидатов, без мутаций; см. docs §9),
# RETENTION_USE_ADVISORY_LOCK (по умолчанию false — при true и jdbc:postgresql: session pg_try_advisory_lock на весь проход hot-body, см. docs §9),
# DB_*, NATS_URL, MINIO_* при RETENTION_WORKER_ENABLED=true.
# Сводный аудит прохода (дополнительно к построчному RETENTION_AUDIT_ENABLED): порог успешно очищенных тел за один проход.
# RETENTION_BULK_AUDIT_MIN_CLEARED=0
# Не дублировать JSON в MinIO, если объект deep-archive / снимка ретенции уже есть (см. docs/RETENTION_AND_DEEP_ARCHIVE.md §6, §9).
# RETENTION_SKIP_SNAPSHOT_IF_DEEP_EXISTS=false
# Лимит времени JDBC (сек.) для SELECT кандидатов hot-body и UPDATE очистки тела в retention-worker; 0 = без лимита.
# RETENTION_JDBC_QUERY_TIMEOUT_SECONDS=0
# Пауза между кандидатами в одном проходе hot-body (мс); 0 = выкл.; см. docs/RETENTION_AND_DEEP_ARCHIVE.md §9
# RETENTION_INTER_MESSAGE_DELAY_MS=0

# Макс. visibility_ttl_seconds при отправке сообщения (по умолчанию 365 суток)
# message.visibility.ttl.max.seconds=31536000
# Макс. archive_ttl_seconds при отправке сообщения (по умолчанию 365 суток)
# message.archive.ttl.max.seconds=31536000
#
# Hot-plug indexer presence gate в core-api:
# hotplug.indexer.presence.required=false
# hotplug.indexer.service.id=indexer-service
# hotplug.heartbeat.ttl.ms=30000
#
# Порог чанкования deep-archive (байты); 0 = без чанков; deep-archiver worker
# DEEP_ARCHIVE_CHUNK_SIZE_BYTES=10485760
#
# Security headers (SecurityHeadersFilter). Env: SECURITY_HEADERS_ENABLED, CSP_POLICY
# csp.policy=default-src 'none'; frame-ancestors 'none'; base-uri 'none'
