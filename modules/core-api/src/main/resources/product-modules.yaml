  label: "Korus Messenger Base"
  state: required
  core_infra: [postgres-hot, redis, nats, minio, keycloak, core-api, ws-gateway, web-lb, worker-message-pipeline]
  external_stack_components: [relational-db-hot, cache, messaging, object-storage, idp, web-edge]
  external_stack_profiles: [postgres-16-bundled, redis-7-bundled, nats-2.10-bundled, s3-minio-bundled, keycloak-24-bundled, nginx-bundled]
  features:
