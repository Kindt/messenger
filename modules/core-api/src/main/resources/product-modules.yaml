    - {key: realtime.presence, label: "Присутствие", owner: base, ui_behavior: show}
    - {key: search.sql.users, label: "SQL-поиск пользователей", owner: base, ui_behavior: show, api_behavior: {mode: allow}}
    - {key: search.sql.messages, label: "SQL-поиск сообщений", owner: base, ui_behavior: show, api_behavior: {mode: allow}}
