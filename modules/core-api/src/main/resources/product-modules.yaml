    - {key: message.threads, label: "Треды", owner: base, ui_behavior: show}
    - {key: message.mentions, label: "Упоминания", owner: base, ui_behavior: show}
    - {key: message.read_receipts, label: "Статусы прочтения", owner: base, ui_behavior: show}
    - {key: message.voice_metadata, label: "Метаданные голосового сообщения", owner: base, ui_behavior: show}
    - {key: file.upload, label: "Загрузка файла", owner: base, ui_behavior: show}
    - {key: file.download, label: "Скачивание файла", owner: base, ui_behavior: show}
    - {key: file.metadata, label: "Метаданные файла", owner: base, ui_behavior: show}
    - {key: file.message_attachment, label: "Вложение к сообщению", owner: base, ui_behavior: show}
