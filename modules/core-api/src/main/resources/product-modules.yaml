    acceptance: {positive: [collaboration-positive], disabled: [collaboration-disabled], degraded: [collaboration-schema-missing]}

  - id: addon-ai
    label: "AI и распознавание"
    degradation_mode: hide
    disabled_behavior: reject
    degraded_behavior: controlled_unavailable
    installing_behavior: controlled_unavailable
    ui_behavior: hide
    network_profile: integrations_egress
    lifecycle_status: active
    internal_infra: [ai-chat-gateway, stt-mock]
    external_stack_components: [integrations]
    external_stack_profiles: [http-webhook-generic]
    migration_bundle: {id: addon-ai, owner: addon-ai, location: db/migration/addons/ai, history_table: flyway_schema_history_addon_ai, schema_objects: [live_caption_sessions, ai_assist_sessions, speech_transcripts]}
