    - {key: identity.user_profiles, label: "Профили пользователей", owner: base, ui_behavior: show}
    - {key: identity.organizations, label: "Организации", owner: base, ui_behavior: show}
    - {key: identity.organization_routing, label: "Маршрутизация по организации", owner: base, ui_behavior: show}
    - {key: auth.sessions, label: "Сессии", owner: base, ui_behavior: show}
    - {key: auth.jwt_validation, label: "Проверка JWT", owner: base, ui_behavior: show}
    - {key: auth.basic_login, label: "Базовый вход", owner: base, ui_behavior: show}
    - {key: contacts.list, label: "Список контактов", owner: base, ui_behavior: show}
    - {key: contacts.add, label: "Добавление контакта", owner: base, ui_behavior: show}
    - {key: contacts.remove, label: "Удаление контакта", owner: base, ui_behavior: show}
    - {key: contacts.search, label: "Поиск пользователей", owner: base, ui_behavior: show}
    - {key: blocks.user_block, label: "Блокировка пользователя", owner: base, ui_behavior: show}
    - {key: blocks.user_unblock, label: "Разблокировка пользователя", owner: base, ui_behavior: show}
    - {key: blocks.list, label: "Список блокировок", owner: base, ui_behavior: show}
    - {key: chat.create, label: "Создание чата", owner: base, ui_behavior: show}
    - {key: chat.list, label: "Список чатов", owner: base, ui_behavior: show}
    - {key: chat.read, label: "Просмотр чата", owner: base, ui_behavior: show}
    - {key: chat.update, label: "Обновление чата", owner: base, ui_behavior: show}
    - {key: chat.members.list, label: "Список участников", owner: base, ui_behavior: show}
    - {key: chat.members.add, label: "Добавление участника", owner: base, ui_behavior: show}
    - {key: chat.members.remove, label: "Удаление участника", owner: base, ui_behavior: show}
