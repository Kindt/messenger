    runtime: {services: [livekit], workers: [], required_secrets: [LIVEKIT_API_KEY, LIVEKIT_API_SECRET, LIVEKIT_URL], health_checks: [livekit_token_issue, room_join], job_policy: drain, hook_policy: skip}
