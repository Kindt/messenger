      - {key: ai.assist.plugin_bridge, label: "AI plugin bridge", owner: addon-ai, ui_behavior: internal, dependencies: [substrate.plugin_platform.invocation]}
      - {key: ai.speech_to_text.start, label: "Start STT", owner: addon-ai, ui_behavior: hide}
      - {key: ai.speech_to_text.stop, label: "Stop STT", owner: addon-ai, ui_behavior: hide}
      - {key: ai.speech_to_text.transcript, label: "STT transcript", owner: addon-ai, ui_behavior: hide}
      - {key: ai.captions.start, label: "Start captions", owner: addon-ai, ui_behavior: hide, dependencies: [live.session.create]}
      - {key: ai.captions.view, label: "View captions", owner: addon-ai, ui_behavior: hide}
      - {key: ai.captions.append, label: "Append captions", owner: addon-ai, ui_behavior: internal}
    gates: {api: [{path: /v1/ai/**, methods: [GET, POST], feature: ai.assist.request, disabled_behavior: reject, degraded_behavior: reject, installing_behavior: reject, http_code: 503, message_key: module.ai.disabled}], ui: [{feature: ai.assist.request, control: ai-assist, behavior: hide}, {feature: ai.captions.start, control: live-captions, behavior: hide}], jobs: [], hooks: [{hook: ai-assist-enrichment, feature: ai.assist.plugin_bridge, disabled_behavior: skip, degraded_behavior: skip}]}
