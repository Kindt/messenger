    - {key: conference.mesh_hook, label: "Mesh hook", owner: base, ui_behavior: show}
    - {key: conference.jitsi_link, label: "Jitsi-ссылка", owner: base, ui_behavior: show}
    - {key: conference.participants_basic, label: "Базовый список участников", owner: base, ui_behavior: show}
    - {key: settings.locale, label: "Язык пользователя", owner: base, ui_behavior: show}
    - {key: settings.privacy, label: "Базовые настройки приватности", owner: base, ui_behavior: show}
    - {key: settings.read_receipts_privacy, label: "Приватность статусов прочтения", owner: base, ui_behavior: show}
    - {key: settings.custom_status, label: "Пользовательский статус", owner: base, ui_behavior: show}
    - {key: settings.do_not_disturb, label: "Не беспокоить", owner: base, ui_behavior: show}
    - {key: admin.basic, label: "Базовая админка", owner: base, ui_behavior: show}
    - {key: admin.organizations, label: "Управление организациями", owner: base, ui_behavior: show}
    - {key: admin.users, label: "Управление пользователями", owner: base, ui_behavior: show}
    - {key: admin.product_modules_view, label: "Просмотр модулей продукта", owner: base, ui_behavior: show}
    - {key: observability.health, label: "Health", owner: base, ui_behavior: show}
    - {key: observability.ready, label: "Ready", owner: base, ui_behavior: show}
    - {key: observability.metrics, label: "Метрики", owner: base, ui_behavior: show}
    - {key: platform.capabilities, label: "Capabilities", owner: base, ui_behavior: show}
    - {key: platform.external_stack_status, label: "Статус внешнего стека", owner: base, ui_behavior: show}

substrates:
  - id: substrate-product-modules
    label: "Product modules runtime substrate"
    features:
      - {key: substrate.product_modules.catalog, label: "Каталог модулей", owner: substrate-product-modules, ui_behavior: internal}
      - {key: substrate.product_modules.install_requests, label: "Install requests", owner: substrate-product-modules, ui_behavior: internal}
    migration_bundle:
      id: substrate-product-modules
      owner: substrate-product-modules
      location: db/migration/substrate/product_modules
      history_table: flyway_schema_history_substrate_product_modules
      schema_objects: [platform_module_overrides, platform_module_install_requests, platform_module_schema_state]
    db_objects: [platform_module_overrides, platform_module_install_requests, platform_module_schema_state]
  - id: substrate-plugin-platform
    label: "Plugin platform substrate"
    features:
      - {key: substrate.plugin_platform.presets, label: "Plugin presets", owner: substrate-plugin-platform, ui_behavior: internal}
      - {key: substrate.plugin_platform.invocation, label: "Plugin invocation", owner: substrate-plugin-platform, ui_behavior: internal}
    migration_bundle:
      id: substrate-plugin-platform
      owner: substrate-plugin-platform
      location: db/migration/substrate/plugin_platform
      history_table: flyway_schema_history_substrate_plugin_platform
      schema_objects: [plugin_presets, plugin_instances, org_plugin_policies, plugin_outbound_events, plugin_invocation_audit]
    db_objects: [plugin_presets, plugin_instances, org_plugin_policies, plugin_outbound_events, plugin_invocation_audit]

addons:
  - id: addon-productivity
    label: "Продуктивность"
    degradation_mode: hide
    disabled_behavior: reject
    degraded_behavior: controlled_unavailable
    installing_behavior: controlled_unavailable
    ui_behavior: hide
    network_profile: internal_mesh
    lifecycle_status: active
    internal_infra: [worker-scheduled-messages, worker-reminders]
    external_stack_components: [relational-db-hot, messaging]
    external_stack_profiles: [postgres-16-bundled, nats-2.10-bundled]
    migration_bundle: {id: addon-productivity, owner: addon-productivity, location: db/migration/addons/productivity, history_table: flyway_schema_history_addon_productivity, schema_objects: [chat_polls, chat_poll_votes, scheduled_messages, message_reminders, sticker_packs, stickers, gif_catalog_entries]}
    runtime: {services: [], workers: [worker-scheduled-messages, worker-reminders], required_secrets: [], health_checks: [scheduler_lag], job_policy: pause, hook_policy: skip}
    features:
      - {key: productivity.polls.create, label: "Создание опросов", owner: addon-productivity, ui_behavior: hide, api_behavior: {mode: reject, http_code: 503, message_key: module.productivity.disabled}}
      - {key: productivity.polls.list, label: "Список опросов", owner: addon-productivity, ui_behavior: hide}
      - {key: productivity.polls.vote, label: "Голосование", owner: addon-productivity, ui_behavior: hide}
      - {key: productivity.polls.close, label: "Закрытие опроса", owner: addon-productivity, ui_behavior: hide}
      - {key: productivity.scheduled_messages.create, label: "Запланировать сообщение", owner: addon-productivity, ui_behavior: hide}
      - {key: productivity.scheduled_messages.list, label: "Список запланированных сообщений", owner: addon-productivity, ui_behavior: hide}
      - {key: productivity.scheduled_messages.cancel, label: "Отмена запланированного сообщения", owner: addon-productivity, ui_behavior: hide}
      - {key: productivity.scheduled_messages.send_due, label: "Отправка due сообщений", owner: addon-productivity, ui_behavior: internal}
      - {key: productivity.reminders.create, label: "Создание напоминаний", owner: addon-productivity, ui_behavior: hide}
      - {key: productivity.reminders.list, label: "Список напоминаний", owner: addon-productivity, ui_behavior: hide}
      - {key: productivity.reminders.cancel, label: "Отмена напоминаний", owner: addon-productivity, ui_behavior: hide}
      - {key: productivity.reminders.fire_due, label: "Срабатывание напоминаний", owner: addon-productivity, ui_behavior: internal}
      - {key: productivity.stickers.packs_list, label: "Список стикерпаков", owner: addon-productivity, ui_behavior: hide}
      - {key: productivity.stickers.packs_create, label: "Создание стикерпака", owner: addon-productivity, ui_behavior: hide}
      - {key: productivity.stickers.use, label: "Использование стикера", owner: addon-productivity, ui_behavior: hide}
      - {key: productivity.gifs.search, label: "Поиск GIF", owner: addon-productivity, ui_behavior: hide}
      - {key: productivity.gifs.use, label: "Использование GIF", owner: addon-productivity, ui_behavior: hide}
    gates:
      api: [{path: /v1/productivity/**, methods: [GET, POST, PUT, DELETE], feature: productivity.polls.create, disabled_behavior: reject, degraded_behavior: reject, installing_behavior: reject, http_code: 503, message_key: module.productivity.disabled}]
      ui: [{feature: productivity.polls.create, control: chat-productivity-actions, behavior: hide}]
      jobs: [{job: scheduled-message-scheduler, feature: productivity.scheduled_messages.send_due, disabled_behavior: pause, degraded_behavior: pause}, {job: reminder-scheduler, feature: productivity.reminders.fire_due, disabled_behavior: pause, degraded_behavior: pause}]
      hooks: []
    acceptance: {positive: [productivity-positive], disabled: [productivity-disabled], degraded: [productivity-degraded]}

  - id: addon-engage
    label: "Уведомления и превью"
    degradation_mode: hide
    disabled_behavior: drop
    degraded_behavior: controlled_unavailable
    installing_behavior: controlled_unavailable
    ui_behavior: hide_push_controls
    network_profile: internal_mesh
    lifecycle_status: active
    internal_infra: [worker-push, worker-preview]
    secrets: [{name: vapid, env_public: PUSH_VAPID_PUBLIC_KEY, env_private: PUSH_VAPID_PRIVATE_KEY}]
    external_stack_components: [notifications, messaging]
    external_stack_profiles: [webpush-vapid-bundled-config, nats-2.10-bundled]
    migration_bundle: {id: addon-engage, owner: addon-engage, location: db/migration/addons/engage, history_table: flyway_schema_history_addon_engage, schema_objects: [device_push_subscriptions, message_link_previews]}
    runtime: {services: [], workers: [worker-push, worker-preview], required_secrets: [PUSH_VAPID_PUBLIC_KEY, PUSH_VAPID_PRIVATE_KEY], health_checks: [vapid_config, preview_fetch], job_policy: drop, hook_policy: skip}
    features:
      - {key: engage.push.subscribe, label: "Подписка push", owner: addon-engage, ui_behavior: hide_push_controls, api_behavior: {mode: reject, http_code: 503, message_key: module.engage.disabled}}
      - {key: engage.push.unsubscribe, label: "Отписка push", owner: addon-engage, ui_behavior: hide_push_controls}
      - {key: engage.push.deliver, label: "Доставка push", owner: addon-engage, ui_behavior: internal}
      - {key: engage.push.device_state, label: "Состояние устройства", owner: addon-engage, ui_behavior: hide_push_controls}
      - {key: engage.link_preview.extract, label: "Извлечение превью", owner: addon-engage, ui_behavior: hide}
      - {key: engage.link_preview.fetch, label: "Загрузка превью", owner: addon-engage, ui_behavior: internal}
      - {key: engage.link_preview.store, label: "Хранение превью", owner: addon-engage, ui_behavior: internal}
      - {key: engage.link_preview.render, label: "Показ превью", owner: addon-engage, ui_behavior: hide}
    gates:
      api: [{path: /v1/me/devices/**, methods: [GET, POST, DELETE], feature: engage.push.subscribe, disabled_behavior: reject, degraded_behavior: reject, installing_behavior: reject, http_code: 503, message_key: module.engage.disabled}]
      ui: [{feature: engage.push.subscribe, control: settings-web-push, behavior: hide}]
      jobs: [{job: push-delivery, feature: engage.push.deliver, disabled_behavior: drop, degraded_behavior: drop}]
      hooks: [{hook: message-link-preview, feature: engage.link_preview.extract, disabled_behavior: skip, degraded_behavior: skip}]
    acceptance: {positive: [engage-positive], disabled: [engage-disabled], degraded: [engage-secrets-missing]}

  - id: addon-search
    label: "Полнотекстовый поиск"
    degradation_mode: fallback
    disabled_behavior: fallback
    degraded_behavior: fallback
    installing_behavior: fallback
    ui_behavior: badge_basic_search
    network_profile: internal_mesh
    lifecycle_status: active
    internal_infra: [solr, zookeeper, worker-indexer]
    env_flags: {search_mode: solr}
    external_stack_components: [search, messaging]
    external_stack_profiles: [solr-bundled, nats-2.10-bundled]
    migration_bundle: {id: addon-search, owner: addon-search, location: db/migration/addons/search, history_table: flyway_schema_history_addon_search, schema_objects: [search_index_state, search_reindex_jobs, search_backend_status]}
    runtime: {services: [solr, zookeeper], workers: [worker-indexer], required_secrets: [], health_checks: [solr_query, indexer_cursor], job_policy: drop, hook_policy: skip}
    features:
      - {key: search.fulltext.messages, label: "Полнотекстовый поиск сообщений", owner: addon-search, ui_behavior: fallback_badge, api_behavior: {mode: fallback, http_code: 200, message_key: module.search.fallback_sql}}
      - {key: search.fulltext.index, label: "Индексация сообщений", owner: addon-search, ui_behavior: internal}
      - {key: search.fulltext.reindex, label: "Переиндексация", owner: addon-search, ui_behavior: disable}
      - {key: search.fulltext.health, label: "Здоровье поиска", owner: addon-search, ui_behavior: badge_degraded}
      - {key: search.fulltext.fallback_sql, label: "Fallback на SQL", owner: addon-search, ui_behavior: fallback_badge}
    gates:
      api: [{path: /v1/search/messages/fulltext, methods: [GET], feature: search.fulltext.messages, disabled_behavior: fallback, degraded_behavior: fallback, installing_behavior: fallback, http_code: 200, message_key: module.search.fallback_sql}]
      ui: [{feature: search.fulltext.messages, control: global-search-mode, behavior: fallback_badge}]
      jobs: [{job: search-indexer, feature: search.fulltext.index, disabled_behavior: drop, degraded_behavior: drop}]
      hooks: [{hook: message-indexing, feature: search.fulltext.index, disabled_behavior: skip, degraded_behavior: skip}]
    acceptance: {positive: [search-positive], disabled: [search-sql-fallback], degraded: [search-degraded-fallback]}

  - id: addon-collaboration
    label: "Совместная работа"
    degradation_mode: hide
    disabled_behavior: reject
    degraded_behavior: controlled_unavailable
    installing_behavior: controlled_unavailable
    ui_behavior: hide
    network_profile: internal_mesh
    lifecycle_status: active
    internal_infra: []
    external_stack_components: [relational-db-hot]
    external_stack_profiles: [postgres-16-bundled]
    migration_bundle: {id: addon-collaboration, owner: addon-collaboration, location: db/migration/addons/collaboration, history_table: flyway_schema_history_addon_collaboration, schema_objects: [chat_kanban_tasks, chat_whiteboards]}
    runtime: {services: [], workers: [], required_secrets: [], health_checks: [], job_policy: stop, hook_policy: skip}
    features:
      - {key: collaboration.kanban.list, label: "Список kanban", owner: addon-collaboration, ui_behavior: hide}
      - {key: collaboration.kanban.create, label: "Создание kanban", owner: addon-collaboration, ui_behavior: hide}
      - {key: collaboration.kanban.update, label: "Обновление kanban", owner: addon-collaboration, ui_behavior: hide}
      - {key: collaboration.kanban.move, label: "Перемещение kanban", owner: addon-collaboration, ui_behavior: hide}
      - {key: collaboration.kanban.delete, label: "Удаление kanban", owner: addon-collaboration, ui_behavior: hide}
      - {key: collaboration.whiteboard.open, label: "Открыть whiteboard", owner: addon-collaboration, ui_behavior: hide}
      - {key: collaboration.whiteboard.save, label: "Сохранить whiteboard", owner: addon-collaboration, ui_behavior: hide}
