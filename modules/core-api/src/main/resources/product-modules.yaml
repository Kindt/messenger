    - {key: chat.folders, label: "Папки чатов", owner: base, ui_behavior: show}
    - {key: chat.channels, label: "Каналы", owner: base, ui_behavior: show}
    - {key: chat.typing, label: "Индикатор набора текста", owner: base, ui_behavior: show}
    - {key: message.send, label: "Отправка сообщения", owner: base, ui_behavior: show}
    - {key: message.read, label: "Чтение сообщений", owner: base, ui_behavior: show}
    - {key: message.edit, label: "Редактирование сообщения", owner: base, ui_behavior: show}
    - {key: message.delete, label: "Удаление сообщения", owner: base, ui_behavior: show}
